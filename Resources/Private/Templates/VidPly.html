<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <f:if condition="{vidply.layout} && {vidply.layout} != 'default'">
        <f:then>
            <f:render partial="VidPly/EpisodeLayout" arguments="{_all}" />
        </f:then>
        <f:else>
            <f:render partial="VidPly/Player" arguments="{_all}" />
        </f:else>
    </f:if>
</f:section>

</html>
