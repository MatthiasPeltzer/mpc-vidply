<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="mpc-episode-cover">
    <f:if condition="{episode.posterReferenceUid}">
        <f:then>
            <picture>
                <source type="image/webp"
                        srcset="{f:uri.image(src: episode.posterReferenceUid, treatIdAsReference: 1, width: '480c', height: '480c', fileExtension: 'webp')} 1x, {f:uri.image(src: episode.posterReferenceUid, treatIdAsReference: 1, width: '960c', height: '960c', fileExtension: 'webp')} 2x" />
                <f:image src="{episode.posterReferenceUid}"
                         treatIdAsReference="1"
                         class="mpc-episode-image"
                         width="480c"
                         height="480c"
                         alt="{episode.posterAlt}"
                         loading="lazy"
                         decoding="async"
                         fileExtension="webp" />
            </picture>
        </f:then>
        <f:else>
            <span class="mpc-episode-placeholder" aria-hidden="true"></span>
        </f:else>
    </f:if>
</div>

</html>
